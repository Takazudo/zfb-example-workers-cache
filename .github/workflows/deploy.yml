# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build  — always runs (push + PR): install, typecheck (`zfb check`), build
#            (`zfb build`), then assert the response-header contract against a
#            local `pnpm preview`. This is the L3 build-output gate; it needs no
#            Cloudflare credentials, so a fresh clone/fork is green immediately.
#            The preview run is also the ONLY place `Cache-Tag` can be checked —
#            the edge strips it, so the post-deploy smoke below cannot see it.
#   deploy — push to `main` only: runs `wrangler deploy`, but SELF-SKIPS when
#              * secrets.CLOUDFLARE_API_TOKEN is unset, or
#              * wrangler.toml still holds a REPLACE_WITH_* placeholder id.
#            So the repo never shows a red deploy before Cloudflare is wired up.
#   smoke  — after a real deploy: checks the live custom domain actually serves
#            this site with the expected cache headers. The domain is confirmed
#            live, so this runs with SMOKE_REQUIRE_LIVE=1: the script's
#            "still provisioning" skip is retired and an unreachable domain now
#            fails the job. See scripts/smoke.mjs.
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit
#                          (+ Account Settings: Read), AND Zone · Workers
#                          Routes: Edit on the takazudomodular.com zone — the
#                          zone permission is what creates the custom-domain
#                          route in wrangler.toml. Without it `wrangler deploy`
#                          uploads the worker and then fails on the route step.
#                          No storage permissions are needed: this example
#                          declares only the ASSETS binding — no KV, AI, or D1 —
#                          and the Cache API is a runtime API.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      # The header contract (Cache-Control, Vary, Cache-Tag) asserted against a
      # local preview. This is the only place Cache-Tag CAN be asserted — the
      # Cloudflare edge consumes and strips it, so the post-deploy run below can
      # never see it. Runs on PRs too, and needs no Cloudflare credentials, so a
      # fork gets the same gate.
      - name: Assert the header contract against a local preview
        timeout-minutes: 5
        env:
          # Without this, a preview that failed to start exits 0 as a SKIP — the
          # same silent-pass this step exists to prevent.
          SMOKE_REQUIRE_LIVE: "1"
          # Fail if the Cache-Tag assertion did not actually run.
          SMOKE_ASSERT_CACHE_TAG: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm preview &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/ && break
            sleep 1
          done
          SMOKE_BASE_URL=http://localhost:4321 pnpm smoke

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Only a live request can confirm the custom domain is really attached —
      # `wrangler deploy` succeeding says nothing about DNS or the edge TLS cert.
      # The step still skips alongside the deploy when the preflight found no
      # credentials, so a fresh clone/fork stays green.
      - name: Smoke test the live custom domain
        if: steps.preflight.outputs.ready == 'true'
        timeout-minutes: 5
        env:
          # The domain is live, so "not serving yet" is no longer a provisioning
          # state — it is an outage. This retires the script's skip path. It does
          # not touch the cache HIT nondeterminism tolerance, which stays
          # non-fatal because the answering PoP still varies run to run.
          SMOKE_REQUIRE_LIVE: "1"
        run: pnpm smoke
